services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: zoft-admin-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres:
    image: postgres:16
    container_name: zoft-admin-postgres
    environment:
      POSTGRES_DB: zoft_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
